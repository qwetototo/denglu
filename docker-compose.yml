services:
  mysql:
    image: mysql:8.0
    container_name: denglu-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: mydb
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./houduandenglu/untitled
      dockerfile: Dockerfile
    container_name: denglu-backend
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: mydb
      DB_USERNAME: root
      DB_PASSWORD: "123456"
      SERVER_PORT: "18081"
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "18081:18081"

  frontend:
    build:
      context: ./qianduanvue3
      dockerfile: Dockerfile
    container_name: denglu-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "18080:80"

volumes:
  mysql_data:
